site_name: MIT-TP Research Scripts
site_description: BEPU uncertainty quantification tools for CFD simulations
use_directory_urls: false

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - toc.integrate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_source: true
            show_root_heading: true
            heading_level: 3

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Tutorial:
    - Demo (Elbow): Demo_elbow.md
  - API Reference:
    - Driver: api/driver.md
    - LHS Sampling: api/processor_BEPU_sampling.md
    - Least-Squares Error: api/processor_leastSquare.md